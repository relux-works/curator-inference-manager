argv = [
  "--model", "/opt/fixture/models/Qwen3.8-27B-Uncensored-MLX-8bit",
  "--host", "{host}",
  "--port", "{port}",
  "--prompt-cache-size", "1",
  "--prompt-cache-bytes", "8GB",
  "--prefill-step-size", "2048",
  "--max-kv-size", "76800",
  "--chat-template-args", "{\"reasoning_effort\": \"medium\"}",
]

